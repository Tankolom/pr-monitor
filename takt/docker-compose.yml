services:
  web:
    build: .
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      disable: true
    # на 4 vCPU можно запустить 2 обработчика: docker compose up -d --scale worker=2
    deploy:
      resources:
        limits:
          memory: 3g

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
